repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff-format
        args: [--config, pyproject.toml]
      - id: ruff
        args: [--fix, --config, pyproject.toml]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy backend/src/
        language: system
        types: [python]
        pass_filenames: false

      - id: bandit
        name: bandit
        entry: bandit -r backend/src/ -c pyproject.toml
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-fast
        name: pytest (fast)
        entry: pytest backend/tests/unit/ -x --tb=short -q
        language: system
        types: [python]
        pass_filenames: false
